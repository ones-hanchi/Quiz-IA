
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QuizAI - Smart Quiz Generator</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>

  <main class="app-container">

    <header class="app-header">
      <div class="logo">Quiz<span>AI</span></div>
      <div class="header-tag">POWERED BY GEMINI</div>
    </header>

    <section class="hero">
      <div class="hero-icon">✦</div>
      <p class="eyebrow">LEARN SOMETHING NEW</p>
      <h1>Create your own <span>AI Quiz</span></h1>
      <p class="subtitle">
        Choose any topic and let AI create a personalized quiz for you.
      </p>
    </section>


    <section id="setup" class="setup-card">

      <label for="topic">What do you want to learn?</label>
      <input
        type="text"
        id="topic"
        
      >

      <div class="settings-grid">

        <div class="field">
          <label for="question-count">Number of questions</label>
          <select id="question-count">
            <option value="5">5 Questions</option>
            <option value="10">10 Questions</option>
            <option value="15">15 Questions</option>
            <option value="20">20 Questions</option>
          </select>
        </div>

        <div class="field">
          <label for="difficulty">Difficulty</label>
          <select id="difficulty">
            <option value="Easy">Easy</option>
            <option value="Medium" selected>Medium</option>
            <option value="Hard">Hard</option>
          </select>
        </div>

        <div class="field full-width">
          <label for="language">Quiz language</label>
          <select id="language">
            <option value="English">English</option>
            <option value="French">Français</option>
            <option value="Arabic">العربية</option>
          </select>
        </div>

      </div>

      <button id="generate-btn" class="primary-btn">
        <span>✦</span> Generate My Quiz
      </button>

      <p id="loading" class="loading hidden">
        ✦ AI is creating your quiz...
      </p>

      <p id="error" class="error hidden"></p>

    </section>


    <section id="quiz" class="quiz-card hidden">

      <div class="quiz-top">
        <span id="question-number">Question 1 / 5</span>
        <span id="score">Score: 0</span>
      </div>

      <div class="progress-track">
        <div id="progress-bar" class="progress-bar"></div>
      </div>

      <div class="timer-area">
        <span>TIME LEFT</span>
        <div id="timer" class="timer">20s</div>
      </div>

      <h2 id="question">Question will appear here</h2>

      <div id="answers" class="answers-list"></div>

      <div id="explanation" class="explanation hidden">
        <h3>✦ Explanation</h3>
        <p id="explanation-text"></p>
      </div>

      <button id="next-btn" class="primary-btn" disabled>
        Next Question →
      </button>

    </section>

    
    <section id="result" class="result-card hidden">

      <div class="result-icon">🏆</div>
      <p class="eyebrow">QUIZ COMPLETED</p>
      <h2>Great job!</h2>

      <p id="final-score" class="final-score"></p>
      <p id="result-message" class="result-message"></p>

      <button id="restart-btn" class="primary-btn">
        Create Another Quiz
      </button>

    </section>

    <footer>
      Created with <span>✦</span> AI
    </footer>

  </main>

</body>
</html>
